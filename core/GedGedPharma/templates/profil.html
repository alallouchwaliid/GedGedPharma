<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GedGed Pharma | Mon Profil</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-50 font-sans text-gray-800 flex h-screen overflow-hidden">

    <!-- Sidebar -->
    <aside class="w-64 shrink-0 bg-gray-900 text-white flex flex-col hidden md:flex">
        <div class="h-16 shrink-0 flex items-center px-6 border-b border-gray-800">
            <i class="fa-solid fa-pills text-emerald-500 text-xl mr-3"></i>
            <span class="text-lg font-bold tracking-wide">GedGed Pharma</span>
        </div>
        <nav class="flex-1 px-4 py-4 space-y-1">
            <a href="{% url 'index' %}" class="flex items-center px-4 py-2.5 text-gray-400 hover:text-white hover:bg-gray-800 rounded-xl font-medium transition">
                <i class="fa-solid fa-chart-line w-5 mr-3"></i> Prévisions
            </a>
            <a href="{% url 'historique' %}" class="flex items-center px-4 py-2.5 text-gray-400 hover:text-white hover:bg-gray-800 rounded-xl font-medium transition">
                <i class="fa-solid fa-box-open w-5 mr-3"></i> Historique
            </a>
            <a href="{% url 'parametres' %}" class="flex items-center px-4 py-2.5 text-gray-400 hover:text-white hover:bg-gray-800 rounded-xl font-medium transition">
                <i class="fa-solid fa-gear w-5 mr-3"></i> Paramètres
            </a>
        </nav>
        <div class="p-4 border-t border-gray-800 text-xs text-gray-500 shrink-0">
            Pharmacie Centrale • Ben Guerir
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col h-screen overflow-hidden">
        
        <!-- Header -->
        <header class="h-16 shrink-0 bg-white border-b border-gray-200 flex items-center justify-between px-6 shadow-sm">
            <h1 class="text-lg md:text-xl font-semibold text-gray-800 truncate pr-4">Mon Profil Pharmacien</h1>
            <div class="w-9 h-9 rounded-full bg-emerald-100 text-emerald-700 flex items-center justify-center font-bold text-sm">
                Dr
            </div>
        </header>

        <!-- Content Area -->
        <div class="flex-1 overflow-y-auto p-8 space-y-6">
            
            <div class="max-w-3xl bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
                <!-- Cover / Top Banner -->
                <div class="bg-gradient-to-r from-gray-900 to-gray-800 p-6 text-white flex items-center space-x-4">
                    <div class="w-16 h-16 rounded-full bg-emerald-500 text-white flex items-center justify-center text-2xl font-bold shadow-md">
                        WA
                    </div>
                    <div>
                        <h2 class="text-xl font-bold">{{ nom_complet }}</h2>
                        <p class="text-emerald-400 text-sm font-medium">{{ role }} • {{ pharmacie }}</p>
                    </div>
                </div>

                <!-- Form Details -->
                <div class="p-6 space-y-6">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div>
                            <label class="block text-gray-500 font-medium mb-1 text-xs uppercase tracking-wider">Nom Complet</label>
                            <input type="text" value="{{ nom_complet }}" readonly class="w-full bg-gray-50 border border-gray-200 rounded-lg px-3 py-2 text-sm text-gray-700 outline-none">
                        </div>
                        <div>
                            <label class="block text-gray-500 font-medium mb-1 text-xs uppercase tracking-wider">Rôle</label>
                            <input type="text" value="{{ role }}" readonly class="w-full bg-gray-50 border border-gray-200 rounded-lg px-3 py-2 text-sm text-gray-700 outline-none">
                        </div>
                        <div>
                            <label class="block text-gray-500 font-medium mb-1 text-xs uppercase tracking-wider">Établissement</label>
                            <input type="text" value="{{ pharmacie }} ({{ ville }})" readonly class="w-full bg-gray-50 border border-gray-200 rounded-lg px-3 py-2 text-sm text-gray-700 outline-none">
                        </div>
                        <div>
                            <label class="block text-gray-500 font-medium mb-1 text-xs uppercase tracking-wider">Email Professionnel</label>
                            <input type="email" value="{{ email }}" readonly class="w-full bg-gray-50 border border-gray-200 rounded-lg px-3 py-2 text-sm text-gray-700 outline-none">
                        </div>
                    </div>

                    <div class="pt-4 border-t border-gray-100 flex justify-between items-center">
                        <p class="text-xs text-gray-400"><i class="fa-solid fa-shield-halved mr-1 text-emerald-500"></i> Compte sécurisé par l'algorithme GedGed Pharma</p>
                        <button onclick="alert('Profil mis à jour avec succès !')" class="bg-emerald-600 hover:bg-emerald-700 text-white px-5 py-2 rounded-lg text-sm font-medium transition shadow-sm">
                            Modifier le Profil
                        </button>
                    </div>
                </div>
            </div>

        </div>
    </main>

</body>
</html>
